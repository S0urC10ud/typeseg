[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "typeseg"
version = "0.3.1"
description = "Fine-grained, character-level content-type segmentation for textual inputs (U-Net + Mamba)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "native/onnxruntime/LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Martin Dallinger" }]
keywords = ["segmentation", "content-type", "security", "mamba", "u-net", "tokenization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["numpy>=1.21", "onnxruntime>=1.17", "protobuf>=4.25"]

[project.urls]
Homepage = "https://github.com/s0urc10ud/semantic-text-segmentation"
Demo = "https://typeseg.martin-dallinger.me"

[project.scripts]
typeseg = "typeseg._cli:main"
segcat = "typeseg._cli:main"

[project.optional-dependencies]
# CUDA: onnxruntime-gpu accelerates the U-Net; cupy runs the Mamba selective-scan
# as a custom CUDA kernel (the ONNX `Scan` op is
# launch-bound and slow on GPU). The base install already ships the fast ONNX CPU
# backend, so this extra only adds the GPU pieces.
#
# cupy-cuda12x[ctk]: CuPy JIT-compiles its kernels via nvrtc at runtime, which needs
# the CUDA toolkit *headers*. The plain cupy wheel ships nvrtc but not the headers,
# so on a box without a system CUDA install the Mamba kernel fails to compile at
# first use. The `[ctk]` extra supplies the toolkit, but ONNX CUDA also needs
# cuDNN and the GPU runtime installed last. See the CUDA setup guide in README.
#
# Gated to non-macOS: neither onnxruntime-gpu nor cupy-cuda12x publishes macOS
# wheels (and Apple has no NVIDIA CUDA), so on a Mac `typeseg[gpu]` resolves to the
# base package instead of failing with ResolutionImpossible.
gpu = [
    # Keep ONNX CUDA aligned with CuPy's CUDA 12 runtime. PyPI 1.27+ defaults to CUDA 13.
    "onnxruntime>=1.20,<1.27; platform_system != 'Darwin'",
    "onnxruntime-gpu>=1.20,<1.27; platform_system != 'Darwin'",
    "cupy-cuda12x[ctk]>=13; platform_system != 'Darwin'",
]

[tool.setuptools]
packages = ["typeseg"]

[tool.setuptools.package-data]
typeseg = ["data/*.npz", "data/*.json", "data/*.onnx"]

[tool.cibuildwheel]
build = "cp39-* cp312-* cp314-* cp313-macosx_x86_64"
# The Intel macOS ONNX Runtime wheel is available through Python 3.13.
skip = "*-musllinux* cp314-macosx_x86_64"
archs = ["native"]
environment = { TYPESEG_REQUIRE_NATIVE = "1", TYPESEG_BACKEND = "cpu" }
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest", "onnx"]
test-command = [
    "python -m pip check",
    "python -c \"import typeseg._scan_cpu; print(typeseg._scan_cpu.simd)\"",
    'python -m pytest "{package}/tests" -q --ignore="{package}/tests/test_cupy_parity.py"',
]
